[package]
name = "potlatch"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/potlatch"
homepage = "https://github.com/savageAZfck/potlatch"
license = "MIT"
description = "Mind economy: signed compute IOUs between sovereign organisms, settled against real invocation records on a hash-chained book — balances derived from history, defaults permanent — named for the gift economy where standing is proven by what you give"
keywords = ["economy", "compute", "iou", "settlement", "agents"]
categories = ["cryptography"]
readme = "README.md"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
